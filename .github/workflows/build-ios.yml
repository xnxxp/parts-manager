name: Build iOS
on:
  push:
    branches: [ios-port]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-port-build
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check JavaScript and prepare the isolated target
        run: |
          npm test
          node scripts/prepare-ios.js
      - name: Install Cordova CLI
        timeout-minutes: 4
        run: npm install --global cordova@13.0.0 --loglevel=info
      - name: Generate the Xcode project
        timeout-minutes: 4
        working-directory: build/ios-project
        run: cordova platform add ios@8.1.1 --verbose
      - name: Install native iOS bridge
        timeout-minutes: 4
        working-directory: build/ios-project
        run: cordova plugin add ./local-plugins/parts-ios --verbose
      - name: Prepare iOS web resources
        timeout-minutes: 4
        working-directory: build/ios-project
        run: cordova prepare ios --verbose
      - name: Compile the device application
        run: |
          xcodebuild -workspace build/ios-project/platforms/ios/App.xcworkspace \
            -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/PartsDerived" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
          test -d "$RUNNER_TEMP/PartsDerived/Build/Products/Release-iphoneos/PartsManager.app"
      - name: Package the IPA
        run: |
          mkdir -p "$RUNNER_TEMP/PartsIPA/Payload" build/ios-output
          ditto "$RUNNER_TEMP/PartsDerived/Build/Products/Release-iphoneos/PartsManager.app" "$RUNNER_TEMP/PartsIPA/Payload/PartsManager.app"
          VERSION=$(node -p "require('./package.json').version")
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/PartsIPA/Payload" "build/ios-output/PartsManager-${VERSION}-unsigned.ipa"
          shasum -a 256 build/ios-output/*.ipa > build/ios-output/SHA256.txt
      - uses: actions/upload-artifact@v7
        with:
          name: PartsManager-iOS
          path: build/ios-output/
          if-no-files-found: error
          retention-days: 7
